name: PR preview

# CI/CD step 3: deploy each PR's build to gh-pages/pr-preview/pr-N/ and
# comment the link on the PR. The preview is removed when the PR closes.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        if: github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'
        env:
          VITE_BASE: /proxy/pr-preview/pr-${{ github.event.number }}/
      - uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
