<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- AR-8: Proxy's mark, a finished card in front of its dashed stand-in, redrawn to read at 16px. Colours are design/tokens.css values. -->
  <style>
    .stand-in { stroke: #1C1E1B; }
    .card { fill: #1D5C86; }
    .lines { stroke: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .stand-in { stroke: #ECEEE8; }
      .card { fill: #86BDE6; }
      .lines { stroke: #0F1B24; }
    }
  </style>
  <rect class="stand-in" x="2.25" y="7.25" width="16" height="22.5" rx="3" fill="none" stroke-width="2.5" stroke-dasharray="4.5 3" />
  <rect class="card" x="12.5" y="1.5" width="17.5" height="24" rx="3" />
  <path class="lines" d="M17 9h8.5M17 14.5h5.5" stroke-width="2.75" stroke-linecap="round" fill="none" />
</svg>
